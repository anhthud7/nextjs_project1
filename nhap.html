<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Glassmorphism Pink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-pink-50 to-rose-100 min-h-screen flex items-center justify-center p-4 relative overflow-hidden font-sans">

  <!-- Background Decorative Blobs (Các khối tròn hiệu ứng gradient phía sau) -->
  <div class="absolute -top-20 -left-20 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-pulse"></div>
  <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-rose-300 rounded-full mix-blend-multiply filter blur-3xl opacity-60 animate-pulse"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-purple-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40"></div>

  <!-- Main Card Container (Glassmorphism effect) -->
  <div class="relative z-10 w-full max-w-4xl bg-white/60 backdrop-blur-xl border border-white/80 rounded-3xl shadow-2xl p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
    
    <!-- LEFT COLUMN: Banner / Illustration -->
    <div class="h-64 md:h-full min-h-[380px] bg-gradient-to-br from-pink-200/80 to-rose-200/50 rounded-2xl border border-white/50 overflow-hidden flex flex-col items-center justify-center p-6 text-center relative group">
      <!-- Decor Circles inside Banner -->
      <div class="absolute top-4 right-4 w-12 h-12 bg-white/30 rounded-full blur-sm"></div>
      <div class="absolute bottom-6 left-6 w-20 h-20 bg-rose-300/30 rounded-full blur-md"></div>
      
      <!-- Placeholder Ảnh / Minh họa (Có thể thay `src` bằng ảnh hình minh họa của bạn) -->
      <img 
        src="https://illustrations.pouch.dev/api/v1/illustration/60c1d1a87e504c0022421fbc/preview" 
        alt="Illustration" 
        class="w-4/5 max-w-[280px] object-contain drop-shadow-md transform group-hover:scale-105 transition duration-500"
      />
    </div>

    <!-- RIGHT COLUMN: Login Form -->
    <div class="px-2 sm:px-6 py-4 flex flex-col justify-between h-full">
      
      <div>
        <!-- Title -->
        <h1 class="text-3xl font-extrabold text-pink-600/90 text-center mb-8 tracking-tight">
          Login
        </h1>

        <form action="#" method="POST" class="space-y-5">
          <!-- Email Field -->
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Email</label>
            <input 
              type="email" 
              required 
              placeholder="Enter your email"
              class="w-full px-4 py-2.5 bg-white/70 border border-pink-200/80 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition shadow-sm"
            >
          </div>

          <!-- Password Field -->
          <div>
            <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1.5">Password</label>
            <input 
              type="password" 
              required 
              placeholder="••••••••"
              class="w-full px-4 py-2.5 bg-white/70 border border-pink-200/80 rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition shadow-sm"
            >
            <div class="text-right mt-1.5">
              <a href="#" class="text-xs text-pink-500 hover:text-pink-600 hover:underline font-medium">forgot password?</a>
            </div>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full bg-rose-400 hover:bg-rose-500 text-white font-semibold py-3 rounded-xl text-sm transition duration-200 shadow-md hover:shadow-lg active:scale-[0.99]"
          >
            Log in
          </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center justify-between">
          <span class="border-b border-pink-200/80 w-1/4"></span>
          <span class="text-xs text-gray-400 font-medium">or continue with</span>
          <span class="border-b border-pink-200/80 w-1/4"></span>
        </div>

        <!-- Social Icons -->
        <div class="flex justify-center items-center gap-4">
          <!-- Google -->
          <button type="button" class="w-10 h-10 bg-white/80 hover:bg-white border border-pink-100 rounded-full flex items-center justify-center shadow-sm hover:shadow transition transform hover:-translate-y-0.5">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
          </button>

          <!-- Facebook -->
          <button type="button" class="w-10 h-10 bg-white/80 hover:bg-white border border-pink-100 rounded-full flex items-center justify-center shadow-sm hover:shadow transition transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 fill-blue-600" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>

          <!-- Apple -->
          <button type="button" class="w-10 h-10 bg-white/80 hover:bg-white border border-pink-100 rounded-full flex items-center justify-center shadow-sm hover:shadow transition transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 fill-gray-900" viewBox="0 0 24 24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.12-1.96.99-3.1-.97.04-2.14.65-2.83 1.45-.62.72-1.16 1.88-1.01 3 .08.01.17.02.25.02 1.09 0 2.22-.62 2.6-1.37z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Footer Branding -->
      <div class="mt-8 text-right">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/80 border border-pink-100 rounded-full text-[11px] text-gray-500 shadow-sm">
          presented by <strong class="text-pink-600 font-bold">Tasmin</strong>
        </span>
      </div>

    </div>

  </div>

</body>
</html>
